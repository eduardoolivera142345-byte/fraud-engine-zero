[package]
name = "fraud-engine-zero"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tonic = "0.10"
tonic-reflection = "0.10"
prost = "0.12"
z3 = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres"] }
redis = { version = "0.24", features = ["tokio-comp"] }
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
tokio-tungstenite = "0.20"
futures-util = "0.3"

[build-dependencies]
tonic-build = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
